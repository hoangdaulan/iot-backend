# Dev backend on this machine. The database and MQTT broker run on the ESP32 machine (reached over
# Tailscale at 100.93.53.111). MQTT is disabled here so readings are not ingested twice; the
# backend on that machine owns the broker connection and migrations.
#   docker compose up -d --build
services:
  backend:
    build: .
    environment:
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://myiot:myiot@100.93.53.111:5432/myiot?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      JWT_TTL: 24h
      CORS_ALLOWED_ORIGINS: "*"
      RUN_MIGRATIONS: "false"
      RUN_SEEDS: "false"
      MQTT_ENABLED: "false"
      MQTT_BROKER: 100.93.53.111
      MQTT_PORT: "1883"
      MQTT_CLIENT_ID: myiot-backend-dev
      MQTT_QOS: "1"
      MQTT_COMMAND_TIMEOUT: 5s
    ports:
      - "${HTTP_PORT:-8080}:8080"
